<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Grocery comparison agent system architecture</title>
  <desc id="desc">A left-to-right customer and agent flow from photo upload through OCR, human review, governed agent execution, catalog evidence, and a validated result. A separate observability rail connects application telemetry to Arize traces, datasets, evaluations, and release decisions.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#36546f"/>
    </marker>
    <marker id="telemetry-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7057a5"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172b3a; }
      .title { font-size: 30px; font-weight: 750; }
      .subtitle { font-size: 16px; fill: #526878; }
      .lane-label { font-size: 14px; font-weight: 700; letter-spacing: .08em; fill: #526878; }
      .head { font-size: 18px; font-weight: 700; }
      .body { font-size: 14px; fill: #4f6473; }
      .small { font-size: 13px; fill: #4f6473; }
      .flow-lane { fill: #f5f8fa; stroke: #c5d5df; stroke-width: 1.5; }
      .app { fill: #ffffff; stroke: #779aaf; stroke-width: 1.8; }
      .human { fill: #e7f5ed; stroke: #3d8b69; stroke-width: 1.8; }
      .agent { fill: #edf4f9; stroke: #3078a8; stroke-width: 2; }
      .data { fill: #fff7df; stroke: #bd8a28; stroke-width: 1.8; }
      .result { fill: #e7f5ed; stroke: #3d8b69; stroke-width: 1.8; }
      .telemetry-lane { fill: #f7f4fc; stroke: #d1c8ea; stroke-width: 1.5; }
      .telemetry { fill: #ffffff; stroke: #7057a5; stroke-width: 1.8; }
      .edge { fill: none; stroke: #36546f; stroke-width: 2.5; marker-end: url(#arrow); }
      .signal { fill: none; stroke: #7057a5; stroke-width: 2; stroke-dasharray: 7 7; marker-end: url(#telemetry-arrow); }
      .tag { font-size: 13px; font-weight: 650; fill: #36546f; }
      .telemetry-tag { font-size: 13px; font-weight: 650; fill: #7057a5; }
      .boundary { stroke: #93a6b2; stroke-width: 1.5; stroke-dasharray: 5 6; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="70" y="58" class="title">Grocery comparison agent: customer flow, governed execution, and observability</text>
  <text x="70" y="88" class="subtitle">Frozen Costco and Walmart catalog snapshots; no live price, inventory, or local-store availability claim.</text>

  <rect x="60" y="126" width="1480" height="358" rx="18" class="flow-lane"/>
  <text x="88" y="162" class="lane-label">CUSTOMER + AGENT FLOW</text>

  <rect x="88" y="220" width="190" height="176" rx="14" class="app"/>
  <text x="112" y="260" class="head">Upload photos</text>
  <text x="112" y="292" class="body">Hosted web app</text>
  <text x="112" y="318" class="body">Shopper preferences</text>

  <path d="M278 308 H326" class="edge"/>

  <rect x="326" y="220" width="190" height="176" rx="14" class="app"/>
  <text x="350" y="260" class="head">Extract items</text>
  <text x="350" y="292" class="body">Worker model OCR</text>
  <text x="350" y="318" class="body">Structured grocery list</text>

  <path d="M516 308 H564" class="edge"/>

  <rect x="564" y="220" width="190" height="176" rx="14" class="human"/>
  <text x="588" y="260" class="head">Review the list</text>
  <text x="588" y="292" class="body">Customer edits items</text>
  <text x="588" y="318" class="body">Approves agent input</text>

  <line x1="778" y1="194" x2="778" y2="422" class="boundary"/>
  <path d="M754 308 H820" class="edge"/>

  <rect x="820" y="202" width="244" height="212" rx="14" class="agent"/>
  <text x="846" y="244" class="head">Governed agent</text>
  <text x="846" y="278" class="body">Plans searches and retries</text>
  <text x="846" y="304" class="body">Writes read-only SQL</text>
  <text x="846" y="330" class="body">Selects evidence and stops</text>
  <text x="846" y="370" class="small">Server controls rounds, calls,</text>
  <text x="846" y="392" class="small">tokens, deadline, and policy</text>

  <path d="M1064 308 H1112" class="edge"/>

  <rect x="1112" y="202" width="220" height="212" rx="14" class="data"/>
  <text x="1138" y="244" class="head">Evidence gateway</text>
  <text x="1138" y="278" class="body">Validates one SELECT</text>
  <text x="1138" y="304" class="body">Costco D1 catalog</text>
  <text x="1138" y="330" class="body">Walmart D1 catalog</text>
  <text x="1138" y="370" class="small">Returns rows, errors,</text>
  <text x="1138" y="392" class="small">and evidence IDs</text>

  <path d="M1332 308 H1380" class="edge"/>

  <rect x="1380" y="220" width="132" height="176" rx="14" class="result"/>
  <text x="1404" y="260" class="head">Result</text>
  <text x="1404" y="292" class="body">Validated</text>
  <text x="1404" y="318" class="body">item outcome</text>
  <text x="1404" y="344" class="body">and evidence</text>

  <text x="88" y="454" class="small">The model can make observable search decisions. The application retains data, policy, validation, and response authority.</text>

  <rect x="60" y="532" width="1480" height="286" rx="18" class="telemetry-lane"/>
  <text x="88" y="568" class="lane-label">OBSERVABILITY + IMPROVEMENT LOOP</text>

  <path d="M183 396 V612" class="signal"/>
  <text x="196" y="516" class="telemetry-tag">application events</text>
  <path d="M942 414 V612" class="signal"/>
  <text x="954" y="516" class="telemetry-tag">OpenInference spans</text>

  <rect x="88" y="612" width="300" height="146" rx="14" class="telemetry"/>
  <text x="114" y="652" class="head">Application telemetry</text>
  <text x="114" y="684" class="body">Requests, latency, errors</text>
  <text x="114" y="710" class="body">OCR, review, response events</text>
  <text x="114" y="738" class="small">Cloudflare logs and metrics</text>

  <path d="M388 685 H436" class="signal"/>

  <rect x="436" y="612" width="250" height="146" rx="14" class="telemetry"/>
  <text x="462" y="652" class="head">Shared identity</text>
  <text x="462" y="684" class="body">workflow_id + trace_id</text>
  <text x="462" y="710" class="body">Request and release versions</text>
  <text x="462" y="738" class="small">Cross-system correlation</text>

  <path d="M686 685 H734" class="signal"/>

  <rect x="734" y="612" width="326" height="146" rx="14" class="telemetry"/>
  <text x="760" y="652" class="head">Arize AX</text>
  <text x="760" y="684" class="body">Agent, model, tool, validation</text>
  <text x="760" y="710" class="body">Tokens, latency, stop reason</text>
  <text x="760" y="738" class="small">OpenTelemetry + OpenInference</text>

  <path d="M1060 685 H1108" class="signal"/>

  <rect x="1108" y="612" width="404" height="146" rx="14" class="telemetry"/>
  <text x="1134" y="652" class="head">Evidence-driven improvement</text>
  <text x="1134" y="684" class="body">Trace-derived regression cases</text>
  <text x="1134" y="710" class="body">Semantic + deterministic evaluations</text>
  <text x="1134" y="738" class="small">Promote, revise, or hold the candidate</text>

  <text x="88" y="852" class="subtitle">One customer workflow links service health, agent behavior, evidence quality, and the release decision.</text>
</svg>
