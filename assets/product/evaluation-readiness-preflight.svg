<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title description">
  <title id="title">Evaluation Readiness Preflight user flow</title>
  <desc id="description">A user-centered flow showing how an AI engineer states a release decision, validates its evidence contract, and runs a decision-ready experiment.</desc>
  <style>
    .bg { fill: #fbfaf7; }
    .title { font: 700 34px ui-sans-serif, system-ui, sans-serif; fill: #17211d; }
    .subtitle { font: 400 18px ui-sans-serif, system-ui, sans-serif; fill: #53625b; }
    .eyebrow { font: 700 14px ui-sans-serif, system-ui, sans-serif; letter-spacing: .08em; fill: #53625b; }
    .head { font: 700 20px ui-sans-serif, system-ui, sans-serif; fill: #17211d; }
    .body { font: 400 17px ui-sans-serif, system-ui, sans-serif; fill: #39463f; }
    .small { font: 400 15px ui-sans-serif, system-ui, sans-serif; fill: #53625b; }
    .strong { font: 700 17px ui-sans-serif, system-ui, sans-serif; fill: #17211d; }
    .number { font: 700 16px ui-sans-serif, system-ui, sans-serif; fill: #ffffff; }
    .surface { fill: #ffffff; stroke: #ccd5cf; stroke-width: 1.5; }
    .current { fill: #e7eee9; stroke: #7a9988; stroke-width: 2; }
    .proposed { fill: #eef1fb; stroke: #7181ba; stroke-width: 2; }
    .outcome { fill: #e1f0e6; stroke: #4d7a60; stroke-width: 2; }
    .review { fill: #fff0cb; stroke: #b67c24; stroke-width: 1.5; }
    .blocked { fill: #fae1df; stroke: #ac4a44; stroke-width: 1.5; }
    .line { stroke: #718076; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    .return { stroke: #b67c24; stroke-width: 2; stroke-dasharray: 7 7; fill: none; marker-end: url(#arrowGold); }
    .divider { stroke: #cbd4ce; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#718076"/>
    </marker>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b67c24"/>
    </marker>
  </defs>

  <rect class="bg" width="1440" height="980"/>
  <text class="title" x="72" y="68">Evaluation Readiness Preflight</text>
  <text class="subtitle" x="72" y="102">From an observed run to an evidence-backed release decision</text>

  <rect class="surface" x="72" y="138" width="1296" height="112" rx="16"/>
  <text class="eyebrow" x="102" y="174">JOB TO BE DONE</text>
  <text class="head" x="102" y="202">When I turn an observed run into an experiment, help me confirm the setup can answer my release question,</text>
  <text class="head" x="102" y="232">so I can decide with confidence before I spend evaluator calls.</text>

  <circle cx="116" cy="318" r="22" fill="#4d7a60"/>
  <text class="number" x="111" y="324">1</text>
  <rect class="current" x="72" y="350" width="298" height="190" rx="16"/>
  <text class="eyebrow" x="102" y="384">OBSERVE</text>
  <text class="head" x="102" y="420">Find behavior worth testing</text>
  <text class="body" x="102" y="452">Select a trace or run.</text>
  <text class="body" x="102" y="478">Customer outcome needs</text>
  <text class="body" x="102" y="504">attention.</text>
  <text class="small" x="102" y="528">Existing: trace → dataset</text>

  <path class="line" d="M 370 445 L 414 445"/>

  <circle cx="458" cy="318" r="22" fill="#4d7a60"/>
  <text class="number" x="453" y="324">2</text>
  <rect class="current" x="414" y="350" width="298" height="190" rx="16"/>
  <text class="eyebrow" x="444" y="384">FRAME</text>
  <text class="head" x="444" y="420">Name the decision</text>
  <text class="body" x="444" y="456">Name the candidate change,</text>
  <text class="body" x="444" y="484">target outcome, and guardrails.</text>
  <text class="small" x="444" y="520">Developer-defined decision contract</text>

  <path class="line" d="M 712 445 L 756 445"/>

  <circle cx="800" cy="318" r="22" fill="#7181ba"/>
  <text class="number" x="795" y="324">3</text>
  <rect class="proposed" x="756" y="350" width="612" height="190" rx="16"/>
  <text class="eyebrow" x="786" y="384">PREFLIGHT</text>
  <text class="head" x="786" y="420">Validate the decision contract</text>
  <line class="divider" x1="1060" y1="438" x2="1060" y2="492"/>
  <text class="body" x="786" y="458">Outcome + quality measures</text>
  <text class="body" x="786" y="486">Latency, tokens, cost, calls</text>
  <text class="body" x="1090" y="458">Evaluator scope + score count</text>
  <text class="body" x="1090" y="486">Prompt, model, data lineage</text>
  <text class="small" x="786" y="520">Uses existing mappings, previews, evaluator setup, and dataset values</text>

  <path class="line" d="M 1062 540 L 1062 594"/>

  <rect class="outcome" x="756" y="608" width="612" height="116" rx="16"/>
  <text class="eyebrow" x="786" y="638">READY OUTCOME</text>
  <text class="head" x="786" y="666">A decision-ready experiment</text>
  <text class="body" x="786" y="694">Know what will improve, what must hold,</text>
  <text class="body" x="786" y="714">and which evidence the decision will contain.</text>

  <path class="line" d="M 1062 724 L 1062 772"/>

  <rect class="current" x="756" y="786" width="286" height="126" rx="16"/>
  <text class="eyebrow" x="786" y="820">RUN</text>
  <text class="head" x="786" y="856">Launch the experiment</text>
  <text class="small" x="786" y="878">Existing Arize</text>
  <text class="small" x="786" y="898">experiment workflow</text>

  <path class="line" d="M 1042 849 L 1080 849"/>

  <rect class="outcome" x="1080" y="786" width="288" height="126" rx="16"/>
  <text class="eyebrow" x="1110" y="820">DECIDE</text>
  <text class="head" x="1110" y="856">Promote, revise, or hold</text>
  <text class="body" x="1110" y="886">With visible evidence and lineage</text>

  <rect class="review" x="72" y="608" width="298" height="116" rx="16"/>
  <text class="eyebrow" x="102" y="642">REVIEW</text>
  <text class="strong" x="102" y="678">Confirm an inferred mapping</text>
  <text class="body" x="102" y="706">Then run preflight again.</text>

  <rect class="blocked" x="414" y="608" width="298" height="116" rx="16"/>
  <text class="eyebrow" x="444" y="642">NEEDS INPUT</text>
  <text class="strong" x="444" y="678">Add required evidence or scope</text>
  <text class="body" x="444" y="706">No evaluator calls are spent.</text>

  <path class="return" d="M 221 608 L 221 574 L 850 574 L 850 540"/>
  <path class="return" d="M 563 608 L 563 560 L 924 560 L 924 540"/>

  <rect x="72" y="792" width="18" height="18" rx="4" fill="#e7eee9" stroke="#7a9988"/>
  <text class="small" x="102" y="807">Developer work and existing Arize workflow</text>
  <rect x="72" y="828" width="18" height="18" rx="4" fill="#eef1fb" stroke="#7181ba"/>
  <text class="small" x="102" y="843">Proposed Evaluation Readiness Preflight</text>
  <rect x="72" y="864" width="18" height="18" rx="4" fill="#e1f0e6" stroke="#4d7a60"/>
  <text class="small" x="102" y="879">Decision outcome</text>
</svg>
